<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskchat 设置</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="settings-body">
    <main class="settings-shell">
      <header class="settings-header">
        <div>
          <h1>Deskchat 设置</h1>
          <p>管理 API、RAGFlow 和长期记忆配置，并随时切换模型。</p>
        </div>
      </header>

      <form id="settingsForm" class="settings-form">
        <section class="settings-section">
          <label for="configSelect">当前配置</label>
          <div class="settings-inline">
            <select id="configSelect"></select>
            <button id="newConfig" type="button" class="secondary">新增</button>
            <button id="deleteConfig" type="button" class="danger">删除</button>
          </div>

          <label for="configName">配置名称</label>
          <input id="configName" autocomplete="off" placeholder="例如：OpenAI 主账号" />

          <label for="provider">服务商</label>
          <select id="provider">
            <option value="openai">OpenAI</option>
            <option value="deepseek">DeepSeek</option>
            <option value="custom">中转站 / 兼容接口</option>
          </select>

          <label for="baseUrl">API 地址</label>
          <input id="baseUrl" autocomplete="off" />

          <label for="apiKey">API Key</label>
          <input id="apiKey" type="password" autocomplete="off" placeholder="sk-..." />

          <label for="model">模型</label>
          <input id="model" autocomplete="off" />
        </section>

        <section class="settings-section">
          <label for="systemPrompt">系统提示词</label>
          <textarea id="systemPrompt" rows="8"></textarea>

          <label class="check standalone-check">
            <input id="enableTools" type="checkbox" />
            <span>允许截图、命令行、鼠标工具调用</span>
          </label>

          <label class="check standalone-check">
            <input id="supportsVision" type="checkbox" />
            <span>支持图片输入 image_url</span>
          </label>
        </section>

        <section class="settings-section">
          <label class="check standalone-check">
            <input id="ragflowEnabled" type="checkbox" />
            <span>Enable RAGFlow knowledge graph engine</span>
          </label>

          <label for="ragflowBaseUrl">RAGFlow Base URL</label>
          <input id="ragflowBaseUrl" autocomplete="off" placeholder="http://localhost:9380" />

          <label for="ragflowApiKey">RAGFlow API Key</label>
          <input id="ragflowApiKey" type="password" autocomplete="off" />

          <label for="ragflowDatasetId">RAGFlow Dataset ID</label>
          <input id="ragflowDatasetId" autocomplete="off" />
        </section>

        <section class="settings-section">
          <label class="check standalone-check">
            <input id="memoryEnabled" type="checkbox" />
            <span>开启长期记忆索引</span>
          </label>

          <label class="check standalone-check">
            <input id="memoryRecallEnabled" type="checkbox" />
            <span>发送消息时自动召回相关长期记忆</span>
          </label>

          <label class="check standalone-check">
            <input id="memoryRememberAssistant" type="checkbox" />
            <span>把助手回复也写入长期记忆</span>
          </label>

          <label for="memoryRecallLimit">每次最多召回记忆条数</label>
          <input id="memoryRecallLimit" type="number" min="0" max="12" step="1" />

          <label for="memoryMinMessageChars">单条消息最少记忆字数</label>
          <input id="memoryMinMessageChars" type="number" min="1" max="200" step="1" />

          <label for="memoryMinChunkChars">索引片段最少字数</label>
          <input id="memoryMinChunkChars" type="number" min="1" max="600" step="1" />
        </section>

        <footer class="settings-actions">
          <span id="settingsStatus" class="settings-status" role="status"></span>
          <button id="resetProvider" type="button" class="secondary">恢复当前服务商默认值</button>
          <button id="saveSettings" type="submit">保存配置</button>
        </footer>
      </form>
    </main>

    <script src="settings.js"></script>
  </body>
</html>
