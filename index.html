<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskchat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">D</div>
        <div>
          <h1>Deskchat</h1>
          <p>本地桌面 AI 助手</p>
        </div>
      </div>

      <div class="sidebar-actions">
        <button id="newConversation" class="new-chat-button" type="button">新建对话</button>
        <button id="newKnowledgeBase" class="new-chat-button subtle" type="button">新建知识库</button>
      </div>

      <nav class="conversation-nav" aria-label="消息列表">
        <div class="nav-row">
          <div class="nav-label">知识库</div>
          <button id="clearKnowledgeSelection" class="mini-button" type="button" title="显示普通对话">全部</button>
        </div>
        <div id="knowledgeList" class="knowledge-list"></div>

        <div class="nav-label other-label">其他对话</div>
        <div id="conversationList" class="conversation-list"></div>
      </nav>
    </aside>

    <main class="chat-shell">
      <header class="chat-toolbar">
        <div class="toolbar-title">
          <strong id="conversationTitle">Deskchat</strong>
          <span>
            <span id="toolbarState">标准模式</span>
            <span class="toolbar-separator">/</span>
            <span id="knowledgeSummary">未选择知识库</span>
            <span class="toolbar-separator">/</span>
            <span id="providerSummary">OpenAI / gpt-5.5</span>
            <span class="toolbar-separator">/</span>
            <span id="keyState">未配置 API Key</span>
          </span>
        </div>
        <div class="toolbar-actions" aria-label="菜单栏">
          <button id="toolbarSettings" type="button" class="secondary">API 配置</button>
          <button id="toolbarUploadKnowledge" type="button" class="secondary">上传到知识库</button>
          <button id="toolbarLinkKnowledge" type="button" class="secondary">加入知识库</button>
          <button id="toolbarShotButton" type="button" class="secondary">截图</button>
          <button id="toolbarClearButton" type="button" class="secondary">清空</button>
          <button id="toolbarNewWindow" type="button" class="secondary">新窗口</button>
          <button id="toolbarDeleteConversation" type="button" class="secondary danger-text">删除</button>
          <button id="compactButton" type="button" class="secondary">长条模式</button>
          <button id="pinButton" type="button" class="secondary">置顶</button>
        </div>
      </header>

      <div id="messages" class="messages"></div>

      <form id="composer" class="composer">
        <div id="attachments" class="attachments"></div>
        <div class="input-row">
          <button id="attachButton" type="button" title="上传图片" class="icon-button">+</button>
          <textarea id="prompt" rows="2" placeholder="输入消息，按 Enter 发送，Shift + Enter 换行"></textarea>
          <button id="sendButton" type="submit">发送</button>
        </div>
        <input id="fileInput" type="file" accept="image/*" multiple hidden />
        <input id="knowledgeFileInput" type="file" multiple hidden />
      </form>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
